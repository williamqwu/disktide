[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsmonitor-cli"
version = "0.2.0"
description = "Interactive terminal disk usage explorer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "textual>=1.0.0",
    "textual-plotext>=0.2.0",
    "squarify>=0.4.0",
    "drawille>=0.2.0",
    "click>=8.0",
    "humanize>=4.0",
]

[project.scripts]
fsmonitor = "fs_monitor.__main__:cli"
fsmonitor-cli = "fs_monitor.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_monitor"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "textual-dev>=1.0.0",
]

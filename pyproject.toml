[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disktide"
version = "0.2.30"
description = "Storage intelligence TUI for exploring, tracking, and safely reclaiming disk space"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["disk-usage", "filesystem", "terminal", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "textual>=8.2,<9",
    "textual-plotext>=1.0,<2",
    "squarify>=0.4.0",
    "click>=8.0",
    "humanize>=4.0",
    # tomllib moved into the stdlib in 3.11; tomli is its upstream.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
watch = [
    "inotify-simple>=2,<3; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/williamqwu/disktide"
Repository = "https://github.com/williamqwu/disktide"
Issues = "https://github.com/williamqwu/disktide/issues"

[project.scripts]
disktide = "disktide.__main__:cli"
sizetrail = "disktide.__main__:cli"
fsmonitor = "disktide.__main__:cli"
fsmonitor-cli = "disktide.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/disktide", "src/fs_monitor"]
# The optional scanner extension is compiled into the build directory by the
# hook below and force-included from there. A `.so` sitting under src/ is a
# developer's in-place build, and sweeping it into a wheel produced a
# py3-none-any that secretly carried an x86_64 binary. The C source
# itself belongs in the sdist, not next to the object it produced.
exclude = ["*.so", "*.pyd", "*.dylib", "*.c"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The sdist has to be able to rebuild the extension, so it carries the C
# source and the hook; an install from it with no compiler falls back to
# `disktide/scanner/_scanfast_py.py` and works everywhere.
include = [
    "src",
    "tool",
    "tests",
    "docs",
    "assets",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.5",
    "textual-dev>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disktide"
version = "0.2.22"
description = "Storage intelligence TUI for exploring, tracking, and safely reclaiming disk space"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["disk-usage", "filesystem", "terminal", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "textual>=8.2,<9",
    "textual-plotext>=1.0,<2",
    "squarify>=0.4.0",
    "click>=8.0",
    "humanize>=4.0",
]

[project.optional-dependencies]
watch = [
    "inotify-simple>=2,<3; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/williamqwu/fsmonitor-cli"
Repository = "https://github.com/williamqwu/fsmonitor-cli"
Issues = "https://github.com/williamqwu/fsmonitor-cli/issues"

[project.scripts]
disktide = "disktide.__main__:cli"
sizetrail = "disktide.__main__:cli"
fsmonitor = "disktide.__main__:cli"
fsmonitor-cli = "disktide.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/disktide", "src/sizetrail", "src/fs_monitor"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "textual-dev>=1.0.0",
]

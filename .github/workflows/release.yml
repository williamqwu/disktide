name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.24"
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --python 3.13
      - name: Build and verify
        run: |
          uv build
          .venv/bin/python tool/verify_distribution.py
          uv venv --python 3.13 .venv-release
          uv pip install --python .venv-release/bin/python dist/sizetrail-*.whl
          uv venv --python 3.13 .venv-release-sdist
          uv pip install --python .venv-release-sdist/bin/python dist/sizetrail-*.tar.gz
          .venv-release/bin/sizetrail doctor --json > doctor.json
          .venv-release-sdist/bin/sizetrail doctor --json > doctor-sdist.json
          .venv-release/bin/fsmonitor --version
          .venv-release/bin/fsmonitor-cli --version
          .venv-release/bin/python tool/check_dependency_budget.py
      - name: Generate checksums and SBOM
        run: |
          mkdir -p release-metadata
          sha256sum dist/* > release-metadata/SHA256SUMS
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            .venv-release/bin/python tool/generate_sbom.py \
              --output release-metadata/sizetrail.cdx.json
          cp doctor.json release-metadata/doctor.json
          cp doctor-sdist.json release-metadata/doctor-sdist.json
      - name: Attest Python distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sizetrail
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
